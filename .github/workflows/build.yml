name: Build

# Baut bei jedem Push den Windows-Installer (Download unter „Actions“ → Lauf → „Artifacts“).
# Ein Tag wie v0.2.0 – oder der manuelle Start mit „Release erstellen“ – veröffentlicht
# zusätzlich ein GitHub-Release mit dem Installer.

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "GitHub-Release mit Installer erstellen"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Tests & Typprüfung
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
        env:
          TZ: Europe/Berlin

  windows:
    name: Windows-Installer
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
      - run: npm ci
      - name: Rust-Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Installer bauen
        if: ${{ !startsWith(github.ref, 'refs/tags/') && !inputs.release }}
        run: npx tauri build
      - name: Installer hochladen
        if: ${{ !startsWith(github.ref, 'refs/tags/') && !inputs.release }}
        uses: actions/upload-artifact@v4
        with:
          name: Fokus-Windows-Installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Release erstellen
        if: ${{ startsWith(github.ref, 'refs/tags/') || inputs.release }}
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: Fokus v__VERSION__
          releaseBody: |
            Lade unten unter „Assets“ die Datei `Fokus_…_x64-setup.exe` herunter und führe sie aus.
            Windows zeigt beim ersten Start evtl. „Der Computer wurde durch Windows geschützt“ –
            dann auf „Weitere Informationen“ → „Trotzdem ausführen“ klicken.
          releaseDraft: false
          prerelease: false
